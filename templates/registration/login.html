<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Smart Seat</title></head>
<body>
  <main>
    <h1>Sign in to Smart Seat</h1>
    {% if form.errors %}<p role="alert">Your username or password was incorrect.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
